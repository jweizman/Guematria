<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guematria - Bible Hébraïque</title>
    <style>
        body {
            font-family: Georgia, serif;
            max-width: 900px;
            margin: 2em auto;
            padding: 0 1em;
            background: #fdf6e3;
            color: #333;
        }
        h1 { text-align: center; color: #586e75; }
        .controls {
            display: flex;
            gap: 0.5em;
            margin-bottom: 1.5em;
            justify-content: center;
        }
        input, button {
            font-size: 1em;
            padding: 0.5em 0.8em;
            border: 1px solid #93a1a1;
            border-radius: 4px;
        }
        button {
            background: #268bd2;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover { background: #2076b8; }
        .verse {
            direction: rtl;
            text-align: right;
            font-size: 1.6em;
            line-height: 2;
            margin: 0.5em 0;
        }
        .verse-num {
            color: #b58900;
            font-size: 0.7em;
            margin-left: 0.5em;
            vertical-align: super;
        }
        .word {
            cursor: pointer;
            padding: 0 0.1em;
            border-radius: 3px;
            transition: background 0.15s;
        }
        .word:hover { background: #eee8d5; }
        .word.active { background: #b58900; color: white; }
        #result {
            position: sticky;
            top: 0;
            z-index: 10;
            margin-bottom: 1.5em;
            padding: 1em;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            min-height: 3em;
        }
        .total {
            font-size: 2em;
            color: #cb4b16;
            font-weight: bold;
        }
        .letters {
            direction: rtl;
            font-size: 1.3em;
            margin-top: 0.5em;
        }
        .letter-box {
            display: inline-block;
            margin: 0.2em;
            padding: 0.3em 0.5em;
            border: 1px solid #93a1a1;
            border-radius: 4px;
            background: #eee8d5;
        }
        .letter-box small { display: block; font-size: 0.6em; color: #586e75; }
        .error { color: #dc322f; }
    </style>
</head>
<body>
    <h1>Guematria - Bible Hébraïque</h1>

    <div class="controls">
        <input id="ref" type="text" value="Genesis.1" placeholder="ex: Genesis.1, Exodus.3, Psalms.23">
        <button onclick="loadChapter()">Charger</button>
    </div>

    <div id="result">Cliquez sur un mot pour voir sa guematria.</div>
    <div id="chapter"></div>

    <script>
        async function loadChapter() {
            const ref = document.getElementById('ref').value.trim();
            const container = document.getElementById('chapter');
            container.innerHTML = 'Chargement...';
            try {
                const res = await fetch('/api/chapter?ref=' + encodeURIComponent(ref));
                const data = await res.json();
                if (data.error) {
                    container.innerHTML = '<p class="error">' + data.error + '</p>';
                    return;
                }
                container.innerHTML = '<h2 style="direction:rtl">' + (data.heRef || data.ref) + '</h2>';
                data.verses.forEach(verse => {
                    const div = document.createElement('div');
                    div.className = 'verse';
                    const num = document.createElement('span');
                    num.className = 'verse-num';
                    num.textContent = verse.number;
                    div.appendChild(num);
                    verse.words.forEach(w => {
                        const span = document.createElement('span');
                        span.className = 'word';
                        span.textContent = w + ' ';
                        span.onclick = () => showGematria(w, span);
                        div.appendChild(span);
                    });
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = '<p class="error">Erreur: ' + e.message + '</p>';
            }
        }

        async function showGematria(word, el) {
            document.querySelectorAll('.word.active').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            const res = await fetch('/api/gematria?word=' + encodeURIComponent(word));
            const data = await res.json();
            const result = document.getElementById('result');

            const letters = data.letters.map(l =>
                '<span class="letter-box">' + l.letter + '<small>' + l.value + '</small></span>'
            ).join('');

            result.innerHTML =
                '<div style="direction:rtl;font-size:1.5em">' + data.word + '</div>' +
                '<div class="letters">' + letters + '</div>' +
                '<div>Total: <span class="total">' + data.total + '</span></div>';
        }

        loadChapter();
    </script>
</body>
</html>
